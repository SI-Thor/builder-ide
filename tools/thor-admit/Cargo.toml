[package]
name = "thor-admit"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A memory-admission daemon for the Thor: leases, a priority queue, and a watchdog"
license = "MIT"
publish = false

[lib]
name = "thor_admit"
path = "src/lib.rs"

[[bin]]
name = "thor-admit"
path = "src/main.rs"

# The synthetic memory hog the integration test drives. It is a separate
# binary so the test can cap its own allocation and never touch the GPU.
[[bin]]
name = "thor-admit-hog"
path = "src/bin/hog.rs"

[dependencies]
# flock(2), fork/execvp/wait4, kill(2) and signal(2). MIT OR Apache-2.0.
libc = "0.2"
# The socket protocol is JSON lines. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The integration test reads the daemon's status as JSON.
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
