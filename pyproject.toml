[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-ide-core"
version = "0.1.0"
description = "builder-ide core service: the audit ledger, the HTTP API, the recipe store, the vocabulary, the night runner, cold start and the USD backbone (core-spec v2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    # The generative batch seat measures meshes: a 700k-triangle prop is
    # read and measured in milliseconds this way, and minutes in pure
    # Python. The USD extra already pulls numpy in; this makes it a
    # dependency in its own right.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# The generative batch seat talks to ComfyUI over HTTP and watches the
# per-node timings over its websocket, which needs an async client. The
# seat runs without it — the night still works, the lane split is just
# unmeasured — so it rides as an extra.
propgen = [
    "aiohttp>=3.9",
]
# The USD backbone's wheels (usd-core, build123d via cadquery-ocp) are heavy
# and aarch64-native; they ride as an extra so the core installs without them.
usd = [
    "usd-core==26.11",
    "build123d==0.13.0",
]
# The tiles seat's retrieval front embeds the library with a local static
# model: model2vec's distilled embeddings are a token table and a tokenizer,
# so a query costs no forward pass and no GPU. The library (MIT) is the
# first download; the seat falls back to feature hashing, which needs
# nothing at all, when this extra is not installed — so it rides as an
# extra and the core installs without it.
embed = [
    "model2vec>=0.10",
]

[project.scripts]
builder-usd = "builder_usd.cli:main"

# One package set for the whole core: `core` is the namespace the seats share
# (core.recipe is the recipe store, core.vocab the vocabulary, core.night the
# runner, core.coldstart the cold start) and `builder_usd` is the
# compiled-scene backbone (core/usd/src).
[tool.setuptools.packages.find]
where = [".", "core/usd/src"]
include = ["core*", "builder_usd*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." keeps the seat packages importable as `core.*`; "core/usd/src" is the
# USD backbone's own root, so one pytest run covers every seat without
# touching any seat's own pyproject.
pythonpath = [".", "core/usd/src"]
# The real-engine acceptance run is opt-in: its render steps drive Infinigen
# 2.0 through the v2 venv (minutes of Cycles on the Thor, and the venv must
# be on the box). The default run deselects it; `-m engine` selects only it.
addopts = "-ra -m 'not engine'"
markers = [
    "engine: the real-engine acceptance run (needs the v2 venv; renders for minutes — select with -m engine)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]
